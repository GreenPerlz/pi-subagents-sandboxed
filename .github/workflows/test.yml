name: Tests

on:
  push:
  pull_request:

jobs:
  pi-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Require the latest bundled Pi runtime
        run: npm run check:pi-version

  test:
    needs: pi-version
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Enable Bubblewrap
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 runner AppArmor blocks unprivileged user namespaces by
          # default. This is an ephemeral test VM; enable them so the suite can
          # exercise real Bubblewrap rather than skipping containment coverage.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind /usr /usr --dir /bin --ro-bind "$(readlink -f /bin)" /bin -- /bin/sh -c true
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
