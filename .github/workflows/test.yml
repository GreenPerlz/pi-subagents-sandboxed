name: Tests

on:
  push:
  pull_request:

jobs:
  pi-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Require the latest bundled Pi runtime
        run: npm run check:pi-version

  test:
    needs: pi-version
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
